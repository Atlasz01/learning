<html>
  <head>
    <title>Rock Paper Scrissor</title>
  </head>
  <body>
    <h1>Rock Paper Scrissor</h1>
    <ul>
      <li>FOR game start</li>
      <li>SEQ: generate random number</li>
      <li>- mod 3 to generate choice</li>
      <li>ENDSEQ</li>
      <li>SEQ: ask for a choice from player</li>
      <li>validate</li>
      <li>ENDSEQ</li>
      <li>compare results</li>
      <li>ENDFOR</li>
    </ul>
    <script>
    
      function getComputerChoice(){
        var random = Math.round(Math.random() * 10) % 3
        if ( random == 0 ) { 
          console.log("Computer choice: ROCK")
          return random }
        else if ( random == 1 ) { 
          console.log("Computer choice: PAPER")
          return random }
        else if ( random == 2 ) { 
          console.log("Computer choice: SCRISSORS")
          return random }
        else return random
      }
      
      function getHumanChoice(){
        var answer = window.prompt("Your answer: ")
        if ( answer == 0 || [0,"R","rock","Rock","ROCK"].includes(answer)) { 
          console.log("Human choice: ROCK")
          return answer }
        else if ( answer == 1 || [1,"P","paper","Paper","PAPER"].includes(answer)) { 
          console.log("Human choice: PAPER")
          return answer }
        else if ( answer == 2 || [2,"S","scrissors","Scrissors","SCRISSORS"].includes(answer)) { 
          console.log("Human choice: SCRISSORS")
          return answer }
        else return answer
      }
      
      function round(){
        var r = getComputerChoice()
        var a = getHumanChoice()
        var list = ["ROCK", "PAPER", "SCRISSORS"]
        if ( r == a ) return 0
        else if ( ((r == 0 || r == 1) && a == r+1) || (r == 2 && a == 0) ) {
          console.log( list[a] + " beats " + list[r] )
          return 1}
        else if ( ((a == 0 || a == 1) && r == a+1) || (a == 2 && r == 0) ) {
          console.log( list[r] + " beats " + list[a] )
          return -1}
        else return 0
      }
      
      function game( rounds ){
        var comp_wins = 0
        var human_wins = 0
        for(var r = 1; r < rounds; r++){
        
          var winner = round()
          
          if (winner == -1) {
            console.log( "Winner: Computer" )
            comp_wins++}
          else if (winner == 1) {
            console.log( "Winner: Human" )
            human_wins++}
          else console.log( "Winner: Nobody " + winner )
        }
        console.log( "Computer: " + comp_wins + " Human: " + human_wins )
      }
      
      game( 5 )
      
      
    </script>
  </body>
</html>
